resumo: >
  O artigo toma a bruxaria não como fenômeno preexistente à sua criminalização, mas como
  categoria jurídico-penal historicamente construída e circulada. Argumenta-se que o Malleus
  Maleficarum (1487) opera uma síntese de cinco tradições fragmentadas — maleficium, heresia,
  demonolatria, lamiae/strigae e pacto diabólico — num tipo penal compósito. O caso de Maria
  Gonçalves Cajada (Bahia, 1591-1593) é tomado como caso-pivô. O marco teórico articula
  Sbriccoli, Meccarelli (arbitrium iudicis) e Susan Sontag.
abstract: >
  The article approaches witchcraft not as a phenomenon preceding its criminalization, but as
  a juridical-criminal category historically constructed and circulated. It argues that the
  Malleus Maleficarum (1487) synthesizes five fragmented traditions into a composite criminal
  type. The case of Maria Gonçalves Cajada (Bahia, 1591-1593) is taken as a pivot case.
superseded_by: "bruxa-como-figura-visual"
note: >
  Versão anterior do trabalho sobre o mesmo caso-pivô, mantida para registro do percurso de
  pesquisa. A tese foi radicalizada na versão posterior, "A bruxa como figura visual", que lê a
  imagem como co-produtora do tipo penal, e não apenas como sua ilustração.
