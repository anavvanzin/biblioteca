title: "O Malleus Maleficarum e a construção da bruxaria como tipo penal: o caso Maria Gonçalves Cajada como objeto historiográfico"
author: "Ana Vitória Vanzin Mendes"
date: "2026"
lang: "pt-BR"
status: "versao-anterior"
status_label: "Versão anterior"
tema: "Bruxaria e dispositivo de enquadramento penal"
disciplina: "DIR410346 — História do Direito Penal e da Justiça Criminal (PPGD/UFSC)"
keywords:
  - "história do direito penal"
