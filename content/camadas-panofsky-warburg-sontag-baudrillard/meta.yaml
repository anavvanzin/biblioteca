resumo: >
  Este artigo propõe uma arquitetura teórica de quatro camadas sucessivas e não intercambiáveis
  para a leitura da alegoria jurídica feminina (Marianne, Britannia, Germania, Columbia, a
  Justiça e a República brasileiras) ao longo dos séculos XIX e XX. A camada de base
  (Panofsky-Warburg) decompõe cada imagem em três níveis de leitura e explica a sobrevivência e
  mutação de fórmulas corporais através dos conceitos de Pathosformel, Nachleben e Zwischenraum.
  A segunda camada mobiliza Susan Sontag para o subconjunto fotográfico e midiático do corpus. A
  terceira, tratada como coda especulativa, arrisca a hipótese baudrillardiana do simulacro de
  quarta ordem. O artigo argumenta que a sucessão delimitada, e não a soma indiscriminada, é o
  que protege a análise do anacronismo metodológico.
abstract: >
  This article proposes a four-layer, non-interchangeable theoretical architecture for reading
  female legal allegory across the nineteenth and twentieth centuries. The base layer
  (Panofsky-Warburg) decomposes each image through Pathosformel, Nachleben and Zwischenraum. The
  second layer mobilizes Susan Sontag for the photographic and media subset of the corpus. The
  third, treated as a speculative coda, risks the Baudrillardian hypothesis of fourth-order
  simulation.
