title: "Camadas de leitura da alegoria jurídica: Panofsky, Warburg, Sontag e Baudrillard na iconografia do Estado"
title_en: "Reading Layers of Legal Allegory: Panofsky, Warburg, Sontag and Baudrillard in State Iconography"
author: "Ana Vitória Vanzin Mendes"
date: "2026"
lang: "pt-BR"
status: "pronto-para-submissao"
status_label: "Pronto para submissão"
tema: "Método iconográfico e teoria da alegoria"
