title: "A bruxa como figura visual: o Malleus Maleficarum como dispositivo de enquadramento entre a dogmática penal e a imagem (séculos XV–XVIII)"
author: "Ana Vitória Vanzin Mendes"
date: "2026"
lang: "pt-BR"
status: "pronto-para-submissao"
status_label: "Pronto para submissão"
tema: "Bruxaria e dispositivo de enquadramento penal"
disciplina: "DIR410346 — História do Direito Penal e da Justiça Criminal (PPGD/UFSC)"
keywords:
  - "história do direito penal"
  - "iconografia da bruxaria"
  - "Malleus Maleficarum"
  - "justiça hegemônica"
  - "Inquisição colonial"
resumo: >
  O artigo propõe que a bruxaria moderna não é um tipo penal que a dogmática descreve e a
  iconografia ilustra, mas uma figura visual produzida por um dispositivo de enquadramento que
  opera simultaneamente no texto (Malleus Maleficarum, 1487), na categoria (Disquisitiones
  Magicae de Del Río, 1599) e na imagem (Compendium Maleficarum de Guazzo, 1608; gravuras de
  Baldung Grien e Dürer). A imagem não ilustra o crime: ela o constitui como figura visível,
  reconhecível e processável. O marco teórico cruza Sbriccoli (justiça hegemônica como aparato
  de enquadramento) com Sontag (a imagem como fabricação que apaga seus rastros). O processo de
  Maria Gonçalves Cajada (Bahia, 1591-1593) é tomado como teste crítico. Conclui-se que a
  deformação colonial é iconográfica antes de dogmática.
abstract: >
  The article argues that early modern witchcraft is not a criminal type described by
  dogmatics and illustrated by iconography, but a visual figure produced by a framing device
  operating simultaneously in text (Malleus Maleficarum, 1487), in categories (Disquisitiones
  Magicae by Del Río, 1599), and in image (Compendium Maleficarum by Guazzo, 1608; engravings
  by Baldung Grien and Dürer). The trial of Maria Gonçalves Cajada (Bahia, 1591-1593) is taken
  as a critical test. It concludes that colonial deformation is iconographic before being
  dogmatic.
supersedes: "bruxa-tipo-penal"
note: >
  Versão radicalizada do trabalho anterior sobre o mesmo caso-pivô: incorpora Susan Sontag como
  lente heurística e a iconografia material (4 xilogravuras de Guazzo e Baldung) como evidência.
