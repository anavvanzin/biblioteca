resumo: >
  A tese deste ensaio é que roupa, nudez, venda e olhar não são ornamentos intercambiáveis. Eles
  organizam modos distintos de apresentar o poder. A venda da Justiça passou de sinal satírico
  de erro ou corrupção a emblema de imparcialidade; a nudez da Liberdade condensa códigos de
  verdade, natureza, maternidade cívica e insurreição; no Brasil, a apropriação republicana
  desses repertórios foi filtrada pelo positivismo e por uma política visual de ordem. O corpo
  feminino alegórico torna-se território de disputa sobre a natureza do poder, os limites da
  cidadania e a relação entre presença simbólica e exclusão institucional.
