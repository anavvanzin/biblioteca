title: "The Unwilled Replica: Two Parallels for the Persistence of Female State Allegory"
author: "Ana Vitória Vanzin Mendes"
date: "2026"
lang: "en-GB"
status: "rascunho"
status_label: "Rascunho — primeiro draft completo"
tema: "Persistência da alegoria de Estado"
keywords:
  - "female state allegory"
  - "meme theory"
  - "Hannah Arendt"
  - "Richard Dawkins"
  - "Aby Warburg"
  - "Pathosformel"
abstract: >
  This article asks why the female allegorical body of the modern state — Marianne, Britannia,
  Germania, Columbia, A República — persists across a century of institutional reproduction
  with such structural fidelity. It proposes two heuristic parallels drawn from outside art
  history and legal historiography: Richard Dawkins's account of the meme as a self-propagating
  unit of cultural imitation, and Hannah Arendt's account of banal, unreflective bureaucratic
  participation in systemic harm. Both parallels are subjected to their own internal critiques
  (Dan Sperber on memetics; Bettina Stangneth on Arendt's account of Eichmann) before being
  folded back into the thesis's own apparatus (Contrato Sexual Visual, Feminilidade de Estado,
  ENDURECIMENTO).
resumo: >
  O artigo pergunta por que o corpo alegórico feminino do Estado moderno persiste por um século
  de reprodução institucional com tal fidelidade estrutural. Propõe dois paralelos heurísticos
  externos à historiografia jurídica — o meme de Dawkins e a banalidade do mal de Arendt — cada
  um submetido à sua própria crítica interna (Sperber; Stangneth) antes de ser reabsorvido pelo
  aparato original da tese (Contrato Sexual Visual, Feminilidade de Estado, ENDURECIMENTO).
  Redigido em inglês.
note: >
  Primeira versão completa, redigida diretamente em inglês como position paper para revisão.
